[package]
name = "coox"
version = "0.1.0"
edition = "2024"

[dependencies]
boa_engine = "0.21.0"
boa_gc = "0.21.0"
boa_runtime = { version = "0.21.0", features = ["all", "reqwest-blocking", "url"] }
crossterm = "0.29.0"
html5ever = "0.38.0"
markup5ever_rcdom = "0.38.0"
ratatui = "0.30.0"
reqwest = { version = "0.13.2", features = ["blocking"] }
stylo = "0.14.0"
taffy = { version = "0.9.2", default-features = false, features = ["alloc", "block_layout", "calc", "content_size", "detailed_layout_info", "flexbox", "grid", "std"] }
